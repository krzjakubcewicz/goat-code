[pytest]
testpaths = scripts/tests
python_files = test_*.py
addopts = -q

# Deliberately NOT parallel. The suite is bound by process spawning - git,
# and the CLI where it is still exercised as a subprocess - not by CPU. On
# Windows, concurrent CreateProcess contends rather than overlaps: measured
# on a 16-core machine, two representative files took 33s serial, 156s with
# `-n 4` and 259s with `-n 8`. If you try xdist again, measure it.
