# cod-ag per-project configuration.
#
# Copy to .codag/config.yaml in the target repository and edit. Everything
# is optional; anything you leave out keeps the default shown here.
#
# Note: .codag/ is excluded from git via .git/info/exclude, so this file is
# local to your machine. Commit it deliberately if your team should share
# it, by adding an exception to .gitignore.

# How many executors run in parallel in one wave. Each gets its own
# worktree, so raise this only as far as your machine and the project's
# install cost allow.
parallel: 3

# How many verify -> replan -> execute cycles before the pipeline stops and
# reports what it could not achieve. There is no "keep trying forever".
max_cycles: 3

# How many rounds of questions the planner may put to you before it must
# produce a plan. Anything still unresolved becomes a recorded assumption.
max_grill_rounds: 3

# How many times the planner may be sent back to fix validator errors.
max_plan_fix_attempts: 2

# The branch every run forks from. null auto-detects: origin/HEAD's target,
# then main, then master. The baseline gates, each slice branch and the
# feature branch all start here, so the final diff is exactly base..feature.
# If you are sitting on another branch with unpushed commits, cod-ag says so
# and starts from the base anyway.
base_branch: null

# Name for the branch the finished work lands on. Created once the plan is
# approved - before any code is written - because the name depends on the
# plan. Placeholders: {kind} (feature|bugfix), {slug} (from the goal),
# {run_id}, {date}, {time}, {user}.
branch_template: "{kind}/{slug}"

# When to stop and ask you to approve the plan before any executor runs.
#   chat   - only a chat-mode run's first cycle (default)
#   always - every cycle, including replans
#   never  - fully autonomous once the plan validates
approval_gate: chat

# Add cod-ag's entries (.codag/, .worktrees/) to the project's .gitignore on
# the first run, creating the file if it does not exist. The change is left
# uncommitted for you to review. Turn this off to rely on .git/info/exclude
# alone, which cod-ag writes either way.
manage_gitignore: true

# Reject an executor's DONE when its commit history shows implementation
# landing before it touched any test. Executors are told to work test-first
# either way; this is what checks. Turn off for a project where that cannot
# hold, and TDD goes back to being instruction only.
enforce_tdd: true

# After a passing verdict on a feature, dispatch an agent to write and run
# an end-to-end test of what was built. Bugfix runs skip it either way - a
# bugfix slice already had to be written test-first.
write_e2e_tests: true

# Append an entry to .codag/progress.txt when a run completes, and show
# earlier entries to the planner. The learnings section is the point: it
# stops the next run rediscovering what this one found out.
write_progress: true

# Install dependencies in each new worktree. Turn this off for projects
# where install is slow and the tests do not need it.
worktree_setup: true

# Write a low-level trace of everything the tool does to log.txt in the run
# directory: every CLI command and its exit code, every subprocess with its
# duration, every phase change, every agent dispatch, every file written.
# Command output is not captured - the trace says what ran, not what it
# printed. CODAG_DEBUG=1 in the environment turns it on regardless, and
# CODAG_DEBUG=0 turns it off regardless.
debug: false

# Seconds before a gate command or a setup command is killed.
gate_timeout_seconds: 1800
setup_timeout_seconds: 1800

# Model per role. Executors run on haiku and escalate to
# executor_escalated after a BLOCKED result.
#
# The orchestrator is the main thread, not an agent, so its model is not
# set here - it comes from the `model:` frontmatter on /cod-ag and
# /cod-ag-resume, or from your session model.
models:
  planner: opus
  executor: haiku
  executor_escalated: sonnet
  synthesizer: sonnet
  e2e: sonnet
  scribe: sonnet
  verifier: opus
  replanner: opus
