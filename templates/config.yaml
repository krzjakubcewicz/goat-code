# goat-code per-project configuration.
#
# Copy to .goatcode/config.yaml in the target repository and edit. Everything
# is optional; anything you leave out keeps the default shown here.
#
# Note: .goatcode/ is excluded from git via .git/info/exclude, so this file is
# local to your machine. Commit it deliberately if your team should share
# it, by adding an exception to .gitignore.

# How many executors run in parallel in one wave. Each gets its own
# worktree, so raise this only as far as your machine and the project's
# install cost allow.
parallel: 3

# How many verify -> replan -> execute cycles before the pipeline stops and
# reports what it could not achieve. There is no "keep trying forever".
max_cycles: 3

# How many rounds of questions the planner may put to you before it must
# produce a plan. Anything still unresolved becomes a recorded assumption.
max_grill_rounds: 3

# How many times the planner may be sent back to fix validator errors.
max_plan_fix_attempts: 2

# How many times one agent may be handed the identical prompt. An agent moves
# the run on only by running its reporting command; one that exits without
# doing so is dispatched again. Past this, a slice is blocked (and retried
# once on the stronger model), a silent classifier falls back to the middle
# workflow, and any other agent stops the run.
max_dispatch_attempts: 3

# The branch every run forks from. The baseline gates, each slice branch and
# the feature branch all start here, so the final diff is exactly
# base..feature.
#
# The first run in a repository fills this in for you: it records the branch
# it detects (origin/HEAD's target, then main, then master), and asks you
# first if you are standing on a different branch. Once it is set no later run
# asks again - change it here, or delete the line to have the next run decide
# afresh.
base_branch: null

# Name for the branch the finished work lands on. Created once the plan is
# approved - before any code is written - because the name depends on the
# plan. Placeholders: {kind} (feature|bugfix), {slug} (from the goal),
# {run_id}, {date}, {time}, {user}.
branch_template: "{kind}/{slug}"

# When to stop and ask you to approve the plan before any executor runs.
#   chat   - only a chat-mode run's first cycle (default)
#   always - every cycle, including replans
#   never  - fully autonomous once the plan validates
approval_gate: chat

# Add goat-code's entries (.goatcode/, .worktrees/) to the project's .gitignore on
# the first run, creating the file if it does not exist. The change is left
# uncommitted for you to review. Turn this off to rely on .git/info/exclude
# alone, which goat-code writes either way.
manage_gitignore: true

# Written by `init --clone`; not a knob to turn by hand. true means this
# repository is a throwaway shallow clone inside a sandbox directory, and the
# run's worktrees and temp files live in that directory, next to the clone,
# instead of the system temp dir.
sandbox: false

# Reject an executor's DONE when its commit history shows implementation
# landing before it touched any test. Executors are told to work test-first
# either way; this is what checks. Turn off for a project where that cannot
# hold, and TDD goes back to being instruction only.
enforce_tdd: true

# After a passing verdict on a feature, dispatch an agent to write and run
# an end-to-end test of what was built. Bugfix runs skip it either way - a
# bugfix slice already had to be written test-first.
write_e2e_tests: true

# Append an entry to .goatcode/progress.txt when a run completes, and show
# earlier entries to the planner. The learnings section is the point: it
# stops the next run rediscovering what this one found out.
write_progress: true

# The subdirectory holding the build system, when detection cannot tell on
# its own. A monorepo with a backend/ and a frontend/ has two, and goat-code
# will not guess which one the gates belong to - so it finds neither, and
# the run has no automated safety net. Name the one to gate:
#
#   project_dir: backend
#
# null auto-detects, which is right for a single-project repository and for
# one whose only build system sits one level down.
project_dir: null

# Install dependencies in each new worktree. Turn this off for projects
# where install is slow and the tests do not need it.
worktree_setup: true

# Write a low-level trace of everything the tool does to log.txt in the run
# directory: every CLI command and its exit code, every subprocess with its
# duration, every phase change, every agent dispatch, every file written.
# Command output is not captured - the trace says what ran, not what it
# printed. GOATCODE_DEBUG=1 in the environment turns it on regardless, and
# GOATCODE_DEBUG=0 turns it off regardless.
debug: false

# Standalone (`goatcode run`) only - the plugin uses Claude Code's own
# permissions. How a headless agent's tool calls are permitted:
#   acceptEdits       - it may write files, but a Bash call needs permission,
#                       and nothing can grant one in a headless run, so it is
#                       denied and reported back to you
#   bypassPermissions - no ceiling: agents run any command unattended
permission_mode: acceptEdits

# Hard dollar cap per agent dispatch. null for none.
max_cost_usd: null

# Wall-clock limit on one agent process, in minutes. A process still running
# past it is stopped and its slice recorded as blocked, so one hung call
# cannot hold the run. null for no limit.
agent_timeout_minutes: 60

# The Claude Code executable, if it is not on PATH.
claude_bin: claude

# The Python interpreter agents are told to call, and the one the repository
# guard hook runs under. null uses plain `python` for the commands when PATH
# has one, else the interpreter running goat-code, and searches PATH for
# python, python3, py for the hook. Set it
# when that search lands on the wrong thing - on Windows, the Microsoft Store
# alias or a pyenv shim. Use forward slashes or single quotes: a backslash in
# double quotes is a YAML escape. If it is set and does not run, the run
# stops instead of falling back to PATH.
#
#   python: 'C:/Users/me/AppData/Local/Programs/Python/Python313/python.exe'
python: null

# Seconds before a gate command or a setup command is killed.
gate_timeout_seconds: 1800
setup_timeout_seconds: 1800

# Classify each run's complexity and risk before planning, and route it:
#   low risk, small     - a plan (the executors still need briefs), then
#                         straight to the executors, judged by the gates
#   complex, or medium  - grill, approval gate, and a verifier verdict
#   high or critical    - all of that, plus your sign-off before it finishes
#
# The classifier is advisory. Deterministic rules may raise a run's risk -
# anything touching auth, crypto, secrets, CI, infra or migrations - and can
# never lower it, so a wrong answer from the model cannot buy less scrutiny.
#
# enabled: false makes every run take the full pipeline, exactly as it did
# before this existed.
classifier:
  enabled: true

# Confine a live run to this repository. While a run is in progress, an
# agent's tool call that resolves outside the repository, its worktrees and
# goat-code's own files is refused and recorded in the run's guard.jsonl. The
# agent is told why and carries on; nothing is killed over one stray path.
#
# In a session you are watching you are asked instead. Allowing the call
# appends the place to extra_roots below as an absolute path - a dependency
# cache such as ~/.m2 whole, anything else by its directory - so you are asked
# once. A headless `goatcode run` has nobody to ask and still refuses.
#
# Dormant when no run is in progress, so your own sessions are untouched.
#
# extra_roots names directories a run genuinely needs - relative to this
# repository. For a monorepo with a sibling package the slices must read:
#
#   guard:
#     extra_roots:
#       - ../design-system
#
# The interpreter's own directory, and the configured python's, are admitted
# automatically, so a python.exe path in a rendered command needs no entry here.
guard:
  enabled: true
  extra_roots: []

# Model per role, including the classifier itself. Executors run on haiku
# and escalate to executor_escalated after a BLOCKED result.
#
# The orchestrator is the main thread, not an agent, so its model is not
# set here - it comes from the `model:` frontmatter on /goat-code and
# /goat-code-resume, or from your session model.
models:
  classifier: haiku
  planner: opus
  executor: haiku
  executor_escalated: sonnet
  synthesizer: sonnet
  e2e: sonnet
  scribe: sonnet
  verifier: opus
  replanner: opus
